---
- name: Criar Bucket S3 na AWS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    bucket_name: "meu-bucket-ansible-demo-paulo-coelho"
    aws_region: "us-east-1"

  tasks:
    - name: Verificar nome do bucket
      ansible.builtin.debug:
        msg: "{{ bucket_name | to_json }}"

    - name: Validar nome do bucket
      ansible.builtin.assert:
        that:
          - bucket_name is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
        fail_msg: "Nome de bucket inválido: {{ bucket_name | to_json }}"

    - name: Criar bucket S3
      amazon.aws.s3_bucket:
        name: "{{ bucket_name }}"
        state: present
        region: "{{ aws_region }}"
        versioning: true
        public_access:
          block_public_acls: true
          block_public_policy: true
          ignore_public_acls: true
          restrict_public_buckets: true
      register: s3_result

    - name: Exibir detalhes do bucket criado
      ansible.builtin.debug:
        msg: "Bucket '{{ bucket_name }}' criado com sucesso na região {{ aws_region }}."
